name: ai-retouch-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "7311:5432"
    environment:
      POSTGRES_USER: retouch
      POSTGRES_PASSWORD: retouch_dev
      POSTGRES_DB: retouch
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retouch -d retouch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "7312:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO 已下架 Docker Hub 上的社区镜像（minio/minio 返回 pull access denied），
    # 官方现存分发渠道为 Quay，故改为 quay.io 并锁定版本，避免 latest 漂移。
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "7313:9000"
      - "7314:9001"
    environment:
      MINIO_ROOT_USER: retouch
      MINIO_ROOT_PASSWORD: retouch_dev
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 以下两个仅在部署时启用：docker compose --profile deploy up -d
  app:
    profiles: ["deploy"]
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 7302
    ports:
      - "7302:7302"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retouch:retouch_dev@postgres:5432/retouch
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:7313
      # CV 模型已在镜像构建期下载到 /opt/cv_models（见 Dockerfile），此处不再挂卷：
      # 挂一个空卷会把镜像里的模型遮挡掉，反而触发运行时重新下载。
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    profiles: ["deploy"]
    build: .
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://retouch:retouch_dev@postgres:5432/retouch
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:7313
      # CV 模型已在镜像构建期下载到 /opt/cv_models（见 Dockerfile），此处不再挂卷：
      # 挂一个空卷会把镜像里的模型遮挡掉，反而触发运行时重新下载。
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
